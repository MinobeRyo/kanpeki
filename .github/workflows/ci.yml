name: Native checks
on:
  pull_request:
    paths:
      - "Mac/**"
      - "apps/SlidePacer/SlidePacer/**"
      - "Tests/IntegratedPracticeTests.swift"
      - "scripts/check_integrated_practice.py"
      - "iOS/**"
      - "experiments/AudioCapture/ios/**"
      - "Shared/**"
      - "Config/**"
      - "Kanpeki.xcodeproj/**"
      - "Tests/CoreTests.swift"
      - "Tests/TimerTests.swift"
      - "Tests/run_tests.sh"
      - "Tests/test_signing.rb"
      - "fastlane/signing.rb"
      - "scripts/check.sh"
      - "Sources/KanpekiCamera/**"
      - "Sources/KanpekiAudioHost/**"
      - "AudioHostTests/**"
      - "CameraTests/**"
      - "Package.swift"
      - ".github/workflows/ci.yml"
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    if: vars.NATIVE_CI_ENABLED == 'true'
    timeout-minutes: 20
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        check: [core, mac, phone]
    steps:
      - uses: actions/checkout@v4
      - if: matrix.check == 'core'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - if: matrix.check == 'core'
        name: Check signing changes stay within iPhone Release
        run: |
          gem install xcodeproj -v 1.27.0 --no-document
          ruby Tests/test_signing.rb
      - run: bash scripts/check.sh "${{ matrix.check }}"
      - if: matrix.check == 'mac'
        name: Check integrated rehearsal lifecycle
        run: python3 scripts/check_integrated_practice.py
      - if: matrix.check == 'core' && hashFiles('Package.swift') != ''
        run: swift test
      - if: matrix.check == 'core'
        run: |
          python3 Tests/test_release.py
          python3 Tests/test_merge_preflight.py
          python3 Tests/test_internal_delivery.py
          python3 Tests/test_slack_delivery.py
          python3 Tests/test_slack_release.py
          python3 Tests/test_slack_progress.py
          python3 Tests/test_mac_testflight.py
          python3 Tests/test_export_infrastructure.py
          ruby -c fastlane/Fastfile
      - if: matrix.check == 'mac'
        run: |
          xcodebuild -project Kanpeki.xcodeproj -scheme KanpekiMac -configuration Release -derivedDataPath .build/mac-store ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO ENABLE_APP_SANDBOX=YES CODE_SIGN_ENTITLEMENTS=Config/Mac-AppStore.entitlements CODE_SIGNING_ALLOWED=NO build
      - if: matrix.check == 'phone'
        run: |
          xcodebuild -project Kanpeki.xcodeproj -scheme KanpekiPhone -configuration Release -destination 'generic/platform=iOS' -archivePath .build/unsigned.xcarchive -derivedDataPath .build/release archive CODE_SIGNING_ALLOWED=NO
