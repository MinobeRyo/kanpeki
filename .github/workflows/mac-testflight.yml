name: Mac TestFlight CD
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kanpeki-mac-testflight
  cancel-in-progress: false
jobs:
  checks:
    if: vars.MAC_TESTFLIGHT_ENABLED == 'true' && vars.NATIVE_CI_ENABLED == 'true'
    uses: ./.github/workflows/ci.yml
  deploy:
    if: github.ref == 'refs/heads/main' && vars.MAC_TESTFLIGHT_ENABLED == 'true'
    needs: checks
    runs-on: macos-15
    timeout-minutes: 60
    environment: testflight
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_HIDE_CHANGELOG: '1'
      FASTLANE_OPT_OUT_USAGE: '1'
      FASTLANE_DISABLE_COLORS: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject stale commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api repos/$GITHUB_REPOSITORY/commits/main --jq .sha)
          test "$latest" = "$GITHUB_SHA"
      - name: Build and sign sandboxed Mac package
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          MAC_INSTALLER_P12_BASE64: ${{ secrets.MAC_INSTALLER_P12_BASE64 }}
          MAC_INSTALLER_P12_PASSWORD: ${{ secrets.MAC_INSTALLER_P12_PASSWORD }}
          MAC_APPSTORE_PROFILE_BASE64: ${{ secrets.MAC_APPSTORE_PROFILE_BASE64 }}
        run: python3 scripts/package_mac_testflight.py
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: gem install fastlane -v 2.238.0 --no-document
      - name: Upload and submit Mac beta review
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: fastlane mac beta
