name: Camera analysis
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Sources/**'
      - 'CameraTests/**'
      - 'Package.swift'
      - 'package.json'
      - '.github/workflows/camera.yml'
permissions:
  contents: read
jobs:
  camera:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
