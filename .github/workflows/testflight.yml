name: TestFlight CD
on:
  push:
    branches: [main]
    paths:
      - 'Mac/**'
      - 'iOS/**'
      - 'Shared/**'
      - 'Sources/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'Config/**'
      - 'Kanpeki.xcodeproj/**'
      - 'fastlane/**'
      - 'docs/TESTFLIGHT_NOTES.txt'
      - 'scripts/**'
      - 'Tests/**'
      - '.github/workflows/testflight.yml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
permissions:
  contents: read
# Do not cancel a job while Apple is processing its upload.
concurrency:
  group: kanpeki-testflight
  cancel-in-progress: false
jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both platforms and signing before spending Mac minutes
        env:
          NATIVE_CI_ENABLED: ${{ vars.NATIVE_CI_ENABLED }}
          IOS_TESTFLIGHT_ENABLED: ${{ vars.IOS_TESTFLIGHT_ENABLED }}
          MAC_TESTFLIGHT_ENABLED: ${{ vars.MAC_TESTFLIGHT_ENABLED }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          MAC_INSTALLER_P12_BASE64: ${{ secrets.MAC_INSTALLER_P12_BASE64 }}
          MAC_INSTALLER_P12_PASSWORD: ${{ secrets.MAC_INSTALLER_P12_PASSWORD }}
          MAC_APPSTORE_PROFILE_BASE64: ${{ secrets.MAC_APPSTORE_PROFILE_BASE64 }}
        run: |
          python3 - <<'PYCODE'
          import os
          flags = ['NATIVE_CI_ENABLED', 'IOS_TESTFLIGHT_ENABLED', 'MAC_TESTFLIGHT_ENABLED']
          names = ['ASC_KEY_ID', 'ASC_ISSUER_ID', 'ASC_KEY_P8_BASE64', 'IOS_DISTRIBUTION_P12_BASE64', 'IOS_DISTRIBUTION_P12_PASSWORD', 'IOS_APPSTORE_PROFILE_BASE64', 'MAC_INSTALLER_P12_BASE64', 'MAC_INSTALLER_P12_PASSWORD', 'MAC_APPSTORE_PROFILE_BASE64']
          missing = [k for k in names if not os.environ.get(k)]
          missing += [k for k in flags if os.environ.get(k) != 'true']
          if missing: raise SystemExit('Release setup incomplete: ' + ', '.join(missing))
          PYCODE
  checks:
    needs: preflight
    uses: ./.github/workflows/ci.yml
  iphone:
    needs: checks
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_HIDE_CHANGELOG: '1'
      FASTLANE_OPT_OUT_USAGE: '1'
      FASTLANE_DISABLE_COLORS: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject stale commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api repos/$GITHUB_REPOSITORY/commits/main --jq .sha)
          test "$latest" = "$GITHUB_SHA" || { echo 'main has moved. Release its latest run instead.'; exit 1; }
      - name: Prepare signing material
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
        run: python3 scripts/prepare_release.py
      - name: Create temporary keychain
        env:
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
        run: |
          keychain_password=$(openssl rand -hex 32)
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$RELEASE_DIR/signing.keychain-db"
          security set-keychain-settings -lut 3600 "$RELEASE_DIR/signing.keychain-db"
          security unlock-keychain -p "$keychain_password" "$RELEASE_DIR/signing.keychain-db"
          security import "$RELEASE_DIR/distribution.p12" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -t cert -f pkcs12 -k "$RELEASE_DIR/signing.keychain-db"
          security list-keychains -d user -s "$RELEASE_DIR/signing.keychain-db"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$keychain_password" "$RELEASE_DIR/signing.keychain-db" >/dev/null
          security find-identity -v -p codesigning "$RELEASE_DIR/signing.keychain-db" | grep 'Apple Distribution:'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install pinned Fastlane
        run: gem install fastlane -v 2.238.0 --no-document
      - name: Archive and upload for internal testing
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          ruby Tests/test_signing.rb
          fastlane ios beta
      - name: Assign iPhone to internal group
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          python3 -m venv "$RUNNER_TEMP/delivery-venv"
          "$RUNNER_TEMP/delivery-venv/bin/pip" install 'cryptography==46.0.5'
          "$RUNNER_TEMP/delivery-venv/bin/python" scripts/internal_delivery.py iphone
      - name: Clean signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/kanpeki-release/signing.keychain-db" 2>/dev/null || true
          python3 scripts/prepare_release.py --cleanup
  mac:
    needs: checks
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_HIDE_CHANGELOG: '1'
      FASTLANE_OPT_OUT_USAGE: '1'
      FASTLANE_DISABLE_COLORS: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject stale commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api repos/$GITHUB_REPOSITORY/commits/main --jq .sha)
          test "$latest" = "$GITHUB_SHA"
      - name: Build and sign sandboxed Mac package
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          MAC_INSTALLER_P12_BASE64: ${{ secrets.MAC_INSTALLER_P12_BASE64 }}
          MAC_INSTALLER_P12_PASSWORD: ${{ secrets.MAC_INSTALLER_P12_PASSWORD }}
          MAC_APPSTORE_PROFILE_BASE64: ${{ secrets.MAC_APPSTORE_PROFILE_BASE64 }}
        run: python3 scripts/package_mac_testflight.py
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: gem install fastlane -v 2.238.0 --no-document
      - name: Upload Mac for internal testing
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: fastlane mac beta
      - name: Assign Mac to internal group
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          python3 -m venv "$RUNNER_TEMP/delivery-venv"
          "$RUNNER_TEMP/delivery-venv/bin/pip" install 'cryptography==46.0.5'
          "$RUNNER_TEMP/delivery-venv/bin/python" scripts/internal_delivery.py mac
