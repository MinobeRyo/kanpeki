name: Mac distribution
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kanpeki-mac-distribution
  cancel-in-progress: false
jobs:
  checks:
    if: vars.MAC_DISTRIBUTION_ENABLED == 'true'
    uses: ./.github/workflows/ci.yml
  distribute:
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 50
    environment: testflight
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject stale commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api repos/$GITHUB_REPOSITORY/commits/main --jq .sha)" = "$GITHUB_SHA"
      - name: Build, sign and notarize
        env:
          MAC_DEVELOPER_ID_P12_BASE64: ${{ secrets.MAC_DEVELOPER_ID_P12_BASE64 }}
          MAC_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MAC_DEVELOPER_ID_P12_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: python3 scripts/package_mac.py
      - name: Publish notarized DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/$GITHUB_REPOSITORY/commits/main --jq .sha)" = "$GITHUB_SHA"
          shasum -a 256 dist/KanpekiMac.dmg > dist/SHA256SUMS.txt
          gh release create "mac-$GITHUB_SHA" dist/KanpekiMac.dmg dist/SHA256SUMS.txt --target "$GITHUB_SHA" --title "Mac 動作確認版 $GITHUB_RUN_NUMBER" --notes-file docs/MAC_INSTALL.md --latest=false
      - name: Notify testers
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          TESTFLIGHT_TESTER_URL: ${{ vars.TESTFLIGHT_TESTER_URL }}
        run: python3 scripts/slack_mac.py
