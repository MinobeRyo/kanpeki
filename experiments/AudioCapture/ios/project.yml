name: KanpekiAudio
options:
  bundleIdPrefix: dev.kanpeki
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  KanpekiAudio:
    type: application
    platform: iOS
    sources:
      - KanpekiAudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kanpeki.audio
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: KanpekiAudio/Info.plist
      properties:
        CFBundleDisplayName: カンペき音声
        NSMicrophoneUsageDescription: 発表の声を録音し、接続したMacで話し方を振り返るために使います。
        NSLocalNetworkUsageDescription: 同じネットワークのMacに発表音声を送り、分析結果を受け取ります。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    scheme:
      gatherCoverageData: false
